<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GSU Connect — Auth &amp; pending screenshots</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; padding: 28px; background: #f8f7f4; color: #1d1b17;
             font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; }
      h1 { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
           font-size: 24px; margin: 0 0 4px; }
      .sub { color: #57534b; font-size: 13px; margin: 0 0 22px; }
      section { break-before: page; }
      section:first-of-type { break-before: auto; }
      h2 { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
           font-size: 16px; margin: 0 0 12px; padding-bottom: 6px;
           border-bottom: 1px solid #e6e3da; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      figure { margin: 0; }
      img { width: 100%; height: auto; display: block; background: #fff;
            border: 1px solid #e6e3da; border-radius: 8px; }
      figcaption { font-size: 12px; color: #57534b; margin-top: 6px; }
      @media print { body { padding: 0; } }
    </style>
  </head>
  <body>
    <h1>GSU Connect — Auth &amp; account-status screenshots</h1>
    <p class="sub">Captured from the real components in headless Chromium. Supabase was answered by a
      local double, so the states are the app's own but the data is sample data.</p>
    <section>
      <h2>Sign in</h2>
      <div class="grid">
      <figure>
        <img src="/qa-screenshots/auth-01-login.png" alt="Sign-in, empty" />
        <figcaption>Sign-in, empty</figcaption>
      </figure>
      <figure>
        <img src="/qa-screenshots/auth-02-login-filled.png" alt="Sign-in, filled" />
        <figcaption>Sign-in, filled</figcaption>
      </figure>
      <figure>
        <img src="/qa-screenshots/auth-03-login-validation.png" alt="Sign-in, blur validation" />

      </figure>
      <figure>
        <img src="/qa-screenshots/auth-04-login-error.png" alt="Sign-in, wrong credentials" />

      </figure>
      <figure>
        <img src="/qa-screenshots/auth-05-login-busy.png" alt="Sign-in, submitting" />
        <figcaption>Sign-in, submitting</figcaption>
      </figure>
      <figure>
        <img src="/qa-screenshots/auth-06-login-dark.png" alt="Sign-in, dark theme" />
        <figcaption>Sign-in, dark theme</figcaption>
      </figure>
      <figure>
        <img src="/qa-screenshots/auth-07-login-desktop.png" alt="Sign-in, desktop" />
        <figcaption>Sign-in, desktop</figcaption>
      </figure>

    </section>

      <figure>

      </figure>
      <figure>

        <img src="/qa-screenshots/signup-11-account-desktop.png" alt="Create account · step 3, desktop" />

    <section>

  </body>
</html>
