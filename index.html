<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c6b52">
<title>GSU Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f5;--ink:#13201b;--muted:#5b6b64;--line:#cfd9d4;--brand:#1c6b52;--brand-ink:#fff;--err:#b3261e;--ok:#1c6b52;--field:#fff;--card:#fff;--mine:#d6efe5;--theirs:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--ink:#e8f0ec;--muted:#93a69d;--line:#2a3a33;--brand:#4cc29a;--brand-ink:#0a1611;--err:#ff8a80;--ok:#4cc29a;--field:#16211c;--card:#16211c;--mine:#1d4a3a;--theirs:#1a2a23}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
.hidden{display:none!important}
main{max-width:420px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0)) 22px 56px}
h1{font-size:2.4rem;line-height:1;margin:0 0 6px;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--muted);margin:0 0 28px}
.tabs{display:flex;border-bottom:1.5px solid var(--line);margin-bottom:22px}
.tabs button{flex:1;background:none;border:0;padding:12px 0;font:inherit;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brand);font-weight:700}
label{display:block;font-weight:500;margin:16px 0 6px}
.hint{display:block;font-size:.85rem;color:var(--muted);font-weight:400;margin-top:2px}
input,select,textarea{width:100%;padding:13px 14px;font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.go{width:100%;margin-top:26px;padding:14px;font:inherit;font-weight:700;background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.msg{margin-top:18px;padding:12px 14px;border-radius:8px;border-left:4px solid;font-size:.95rem}
.msg.err{color:var(--err);border-color:var(--err)}
.msg.ok{color:var(--ok);border-color:var(--ok)}

/* ---- app shell ---- */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto;background:var(--bg);position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0)) 12px 10px;border-bottom:1.5px solid var(--line);background:var(--bg)}
.bar h2{flex:1;margin:0;font-size:1.15rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{position:relative;min-width:44px;height:44px;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:1.4rem;cursor:pointer}
.badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:.72rem;font-weight:700;line-height:18px;text-align:center}
.menu{position:absolute;right:10px;top:calc(60px + env(safe-area-inset-top,0));z-index:20;min-width:230px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px;border:0;background:none;color:var(--ink);font:inherit;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--line)}
.view{flex:1;overflow-y:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom,0))}
.row{display:block;width:100%;text-align:left;padding:14px;margin:0 0 10px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;cursor:pointer}
.row b{display:block}
.row span{color:var(--muted);font-size:.9rem}
.section{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:18px 2px 8px}
.empty{color:var(--muted);padding:8px 2px}
.btn{padding:10px 14px;font:inherit;font-weight:700;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.bad{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.6;cursor:wait}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.card img.idpic{display:block;width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:8px;margin-top:10px}
.card p{margin:2px 0;word-break:break-word}

/* ---- chat ---- */
#v-chat{display:flex;flex-direction:column;padding:0}
#msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--theirs);border:1.5px solid var(--line);align-self:flex-start;word-break:break-word;cursor:pointer}
.m.mine{align-self:flex-end;background:var(--mine);border-color:transparent}
.m .who{font-size:.8rem;font-weight:700;color:var(--brand)}
.m .who i{font-style:normal;font-weight:500;color:var(--muted)}
.m .txt{white-space:pre-wrap}
.m .time{font-size:.72rem;color:var(--muted);text-align:right;margin-top:2px}
.m img.pic{display:block;max-width:100%;max-height:300px;border-radius:8px;margin:4px 0}
.m .file{display:inline-block;margin:4px 0;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);color:var(--ink);background:none;font:inherit;cursor:pointer;text-align:left}
.older{align-self:center;margin-bottom:4px}
#composer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0));border-top:1.5px solid var(--line);background:var(--bg)}
#composer textarea{flex:1;max-height:120px;resize:none;padding:11px 12px}
#composer .icon{border:1.5px solid var(--line);font-size:1.2rem}
#composer .send{height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;cursor:pointer}
#composer .send:disabled{opacity:.6}
#chip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;font-size:.9rem;border-top:1.5px solid var(--line);background:var(--card)}
#readonly{padding:14px;text-align:center;color:var(--muted);border-top:1.5px solid var(--line)}

/* ---- sheet + toast ---- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0))}
.sheet h3{margin:0 0 10px;font-size:1.05rem}
.sheet .btn{display:block;width:100%;margin-top:8px;text-align:left}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translateX(-50%);max-width:90%;padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--bg);z-index:40;font-size:.95rem}
</style>
</head>
<body>
<main id="auth-main">
  <h1>GSU Connect</h1>
  <p class="sub">The messenger for Gombe State University students and staff.</p>

  <section id="auth">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-login" aria-selected="true">Log in</button>
      <button role="tab" id="tab-signup" aria-selected="false">Create account</button>
    </div>

    <form id="login" onsubmit="return false">
      <label for="l-matric">Matric number</label>
      <input id="l-matric" autocomplete="username" placeholder="UG20/SCSL/1046" required>
      <label for="l-pass">Password</label>
      <input id="l-pass" type="password" autocomplete="current-password" required>
      <button class="go" type="submit">Log in</button>
    </form>

    <form id="signup" class="hidden" onsubmit="return false">
      <label for="s-name">Full name</label>
      <input id="s-name" autocomplete="name" required>
      <label for="s-matric">Matric number</label>
      <input id="s-matric" placeholder="UG20/SCSL/1046" required>
      <label for="s-dept">Department<span class="hint">Write it in full, the same way as your classmates, for example Science Laboratory Technology. Your department chat is made from this.</span></label>
      <input id="s-dept" placeholder="Science Laboratory Technology" required>
      <label for="s-level">Level</label>
      <select id="s-level" required>
        <option value="">Choose your level</option>
        <option>100</option><option>200</option><option>300</option><option>400</option><option>500</option>
      </select>
      <label for="s-pass">Password<span class="hint">At least 6 characters. Write it down, there is no email reset.</span></label>
      <input id="s-pass" type="password" autocomplete="new-password" minlength="6" required>
      <label for="s-id">Photo of your student ID card<span class="hint">Used once to check you are a GSU student, then deleted. Max 3 MB.</span></label>
      <input id="s-id" type="file" accept="image/*" required>
      <button class="go" type="submit">Create account</button>
    </form>
    <div id="msg" class="msg hidden" role="status"></div>
  </section>
</main>

<div id="app" class="hidden">
  <header class="bar">
    <button id="back" class="icon hidden" aria-label="Back">&#8592;</button>
    <h2 id="title">GSU Connect</h2>
    <button id="menu-btn" class="icon" aria-label="Menu">&#9776;<span id="badge" class="badge hidden"></span></button>
  </header>
  <nav id="menu" class="menu hidden"></nav>

  <section id="v-list" class="view"></section>

  <section id="v-chat" class="view hidden">
    <div id="msgs"></div>
    <div id="readonly" class="hidden">Only approved staff and reps can post here.</div>
    <div id="chip" class="hidden"><span id="chip-name"></span><button type="button" class="btn" id="chip-x">Remove</button></div>
    <form id="composer" onsubmit="return false">
      <input id="file" type="file" class="hidden" accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt">
      <button type="button" class="icon" id="attach" aria-label="Attach a file">&#128206;</button>
      <textarea id="text" rows="1" maxlength="2000" placeholder="Write a message" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </section>

  <section id="v-people" class="view hidden">
    <label for="q" style="margin-top:0">Find a student or staff member by name</label>
    <input id="q" placeholder="Type at least 2 letters" autocomplete="off">
    <div id="people-list" style="margin-top:14px"></div>
  </section>

  <section id="v-review" class="view hidden"></section>
  <section id="v-reports" class="view hidden"></section>

  <section id="v-roles" class="view hidden">
    <label for="rq" style="margin-top:0">Find a person by name or matric number</label>
    <input id="rq" placeholder="Type at least 2 characters" autocomplete="off">
    <div id="roles-list" style="margin-top:14px"></div>
  </section>

  <section id="v-blocked" class="view hidden"></section>
</div>

<div id="sheet-bg" class="backdrop hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="hidden" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';document.head.appendChild(s)"></script>
<script>
// Public (anon) key only. Never put the service_role key in this file.
const SUPABASE_URL = 'https://wctkyqydjoepgmlhfsiw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjdGt5cXlkam9lcGdtbGhmc2l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTQwNjYsImV4cCI6MjExMDA3MDA2Nn0.p1lbYQ4gDrpmsYbsnOXDut2Fq3rdIao74S99wtP0A9U';
let sb = null;
function ready() {
  if (!sb && window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  if (sb) return true;
  say('The app could not load its login library. Check your internet connection, open this page in Chrome, and try again.', 'err');
  return false;
}

const $ = id => document.getElementById(id);
const MATRIC = /^[a-z0-9]+(\/[a-z0-9]+){2,}$/i;
const toEmail = m => m.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '@gsuconnect.app';

// Build elements with textContent only, so nothing a user types can run as code
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(label, cls, fn) { const b = el('button', cls, label); b.type = 'button'; b.onclick = fn; return b; }

function say(text, kind) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + kind; }
function clearMsg() { $('msg').className = 'msg hidden'; }
let toastTimer;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 3500);
}
function show(tab) {
  const login = tab === 'login';
  $('login').classList.toggle('hidden', !login);
  $('signup').classList.toggle('hidden', login);
  $('tab-login').setAttribute('aria-selected', login);
  $('tab-signup').setAttribute('aria-selected', !login);
  clearMsg();
}
$('tab-login').onclick = () => show('login');
$('tab-signup').onclick = () => show('signup');
function busy(form, on) { form.querySelector('.go').disabled = on; }

/* ---------------- sign up and log in ---------------- */
$('signup').onsubmit = async e => {
  e.preventDefault(); clearMsg();
  if (!ready()) return;
  const f = e.target;
  const matric = $('s-matric').value.trim().toUpperCase();
  const file = $('s-id').files[0];
  if (!MATRIC.test(matric)) return say('Enter your matric number with slashes, like UG20/SCSL/1046.', 'err');
  if (!file || !file.type.startsWith('image/')) return say('Choose a photo of your ID card.', 'err');
  if (file.size > 3 * 1024 * 1024) return say('That photo is over 3 MB. Take a smaller photo or lower the quality.', 'err');

  busy(f, true);
  try {
    const { data, error } = await sb.auth.signUp({ email: toEmail(matric), password: $('s-pass').value });
    if (error) throw error;
    if (!data.session) throw new Error('Email confirmation is still on in Supabase. Turn it off under Authentication settings.');
    const uid = data.user.id;

    const { error: pErr } = await sb.from('profiles').insert({
      id: uid, full_name: $('s-name').value.trim(), matric_no: matric,
      department: $('s-dept').value.trim(), level: $('s-level').value
    });
    if (pErr) throw pErr;

    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const { error: uErr } = await sb.storage.from('id-cards').upload(uid + '/id.' + ext, file, { upsert: true });
    await sb.auth.signOut();
    if (uErr) return say('Account created, but the ID photo did not upload. Log in later and tell your approver.', 'err');
    f.reset(); show('login');
    say('Account created. An approver will check your details, then you can log in.', 'ok');
  } catch (err) {
    const t = String(err.message || err);
    say(/already registered/i.test(t) ? 'This matric number already has an account. Log in instead.' : t, 'err');
  }
  busy(f, false);
};

$('login').onsubmit = async e => {
  e.preventDefault(); clearMsg();
  if (!ready()) return;
  const f = e.target; busy(f, true);
  const { data, error } = await sb.auth.signInWithPassword({ email: toEmail($('l-matric').value), password: $('l-pass').value });
  if (error) { busy(f, false); return say('Wrong matric number or password. Check both and try again.', 'err'); }
  await enter(data.user.id);
  busy(f, false);
};

/* ---------------- app state ---------------- */
const REVIEWERS = ['admin', 'class_rep', 'dept_helper'];
const POSTERS = ['admin', 'class_rep', 'dept_helper', 'lecturer'];
const ROLE_LABEL = { admin: 'Admin', class_rep: 'Class rep', dept_helper: 'Dept helper', lecturer: 'Lecturer/staff', student: 'Student' };
const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf', 'text/plain',
  'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  'application/vnd.ms-powerpoint', 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
  'application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];
const MAX_FILE = 5 * 1024 * 1024;

let me = null;
let blocked = new Map();   // user id -> name
let room = null, chan = null, oldestId = null, pendingFile = null;
const seen = new Set();

async function enter(uid) {
  const { data: p } = await sb.from('profiles').select('*').eq('id', uid).single();
  if (!p || p.status !== 'approved') {
    await sb.auth.signOut();
    return say(p && p.status === 'rejected'
      ? 'Your sign-up was not approved. Contact your class rep or department helper.'
      : 'Your account is waiting for approval. Try again later.', 'err');
  }
  me = p;
  $('auth-main').classList.add('hidden');
  $('app').classList.remove('hidden');
  buildMenu();
  await loadBlocks();
  go('list'); loadList(); refreshBadge();
}

function logout() {
  leaveRoom();
  const done = () => { me = null; blocked.clear(); $('app').classList.add('hidden'); $('auth-main').classList.remove('hidden'); show('login'); };
  if (sb) sb.auth.signOut().then(done, done); else done();
}

const VIEWS = ['list', 'chat', 'people', 'review', 'reports', 'roles', 'blocked'];
function go(v, title) {
  VIEWS.forEach(n => $('v-' + n).classList.toggle('hidden', n !== v));
  $('title').textContent = title || 'GSU Connect';
  $('back').classList.toggle('hidden', v === 'list');
  $('menu').classList.add('hidden');
  if (v !== 'chat') leaveRoom();
}
$('back').onclick = () => { go('list'); loadList(); };
$('menu-btn').onclick = () => $('menu').classList.toggle('hidden');
document.addEventListener('click', e => {
  if (!$('menu').contains(e.target) && !$('menu-btn').contains(e.target)) $('menu').classList.add('hidden');
});

function buildMenu() {
  const m = $('menu'); m.replaceChildren();
  const item = (label, fn) => { const b = btn(label, '', fn); m.append(b); return b; };
  item('Chats', () => { go('list'); loadList(); });
  item('New private chat', () => { go('people', 'New private chat'); $('q').value = ''; $('people-list').replaceChildren(); $('q').focus(); });
  if (REVIEWERS.includes(me.role)) {
    const b = item('Approve sign-ups', () => { go('review', 'Approve sign-ups'); loadReview(); });
    b.append(el('span', 'badge hidden', '')); b.lastChild.id = 'menu-badge'; b.lastChild.style.position = 'static';
  }
  if (me.role === 'admin') {
    item('Reports', () => { go('reports', 'Reports'); loadReports(); });
    item('Roles', () => { go('roles', 'Roles'); $('rq').value = ''; $('roles-list').replaceChildren(); });
  }
  item('Blocked people', () => { go('blocked', 'Blocked people'); renderBlocked(); });
  item('Log out', logout);
}

async function refreshBadge() {
  if (!REVIEWERS.includes(me.role)) return;
  const { count } = await sb.from('profiles').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  const n = count || 0;
  for (const id of ['badge', 'menu-badge']) {
    const b = $(id); if (!b) continue;
    b.textContent = n; b.classList.toggle('hidden', n === 0);
  }
}

/* ---------------- chat list ---------------- */
async function loadList() {
  const box = $('v-list'); box.replaceChildren(el('p', 'empty', 'Loading…'));
  const [r, d] = await Promise.all([
    sb.from('rooms').select('id,kind,name').neq('kind', 'dm'),
    sb.rpc('my_dms')
  ]);
  box.replaceChildren();
  if (r.error) return box.append(el('p', 'empty', 'Could not load chats. Check your connection.'));
  const order = { all: 0, announce: 1, dept: 2 };
  const sub = { all: 'Everyone at GSU', announce: 'Official notices from staff and reps', dept: 'Your department' };
  box.append(el('div', 'section', 'Groups'));
  (r.data || []).sort((a, b) => order[a.kind] - order[b.kind]).forEach(x => {
    const b = btn('', 'row', () => openRoom(x));
    b.append(el('b', '', x.name), el('span', '', sub[x.kind]));
    box.append(b);
  });
  box.append(el('div', 'section', 'Private chats'));
  const dms = d.data || [];
  if (!dms.length) box.append(el('p', 'empty', 'No private chats yet. Use the menu, then New private chat.'));
  dms.forEach(x => {
    const b = btn('', 'row', () => openRoom({ id: x.room_id, kind: 'dm', name: x.other_name, other_id: x.other_id }));
    b.append(el('b', '', x.other_name), el('span', '', ROLE_LABEL[x.other_role] || ''));
    box.append(b);
  });
}

/* ---------------- blocks ---------------- */
async function loadBlocks() {
  const { data } = await sb.from('blocks').select('blocked_id,blocked_name');
  blocked = new Map((data || []).map(b => [b.blocked_id, b.blocked_name]));
}
function renderBlocked() {
  const box = $('v-blocked'); box.replaceChildren();
  if (!blocked.size) return box.append(el('p', 'empty', 'You have not blocked anyone.'));
  blocked.forEach((name, id) => {
    const c = el('div', 'card'); c.append(el('b', '', name || 'Unknown'));
    const a = el('div', 'actions');
    a.append(btn('Unblock', 'btn', async () => {
      const { error } = await sb.from('blocks').delete().eq('blocked_id', id);
      if (error) return toast('Could not unblock. Try again.');
      blocked.delete(id); renderBlocked();
    }));
    c.append(a); box.append(c);
  });
}

/* ---------------- a chat room ---------------- */
function leaveRoom() {
  if (chan) { sb.removeChannel(chan); chan = null; }
  room = null; pendingFile = null;
}

async function openRoom(r) {
  go('chat', r.name);
  room = r; seen.clear(); oldestId = null; pendingFile = null;
  $('msgs').replaceChildren(); $('text').value = ''; $('chip').classList.add('hidden');
  const canPost = r.kind !== 'announce' || POSTERS.includes(me.role);
  $('composer').classList.toggle('hidden', !canPost);
  $('readonly').classList.toggle('hidden', canPost);
  await loadMessages(false);
  if (!room || room.id !== r.id) return;
  chan = sb.channel('room-' + r.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.' + r.id },
        p => addMessage(p.new, 'end'))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' },
        p => { const n = $('msgs').querySelector('[data-id="' + Number(p.old.id) + '"]'); if (n) n.remove(); })
    .subscribe();
}

async function loadMessages(older) {
  const box = $('msgs');
  let q = sb.from('messages').select('*').eq('room_id', room.id).order('id', { ascending: false }).limit(40);
  if (older && oldestId) q = q.lt('id', oldestId);
  const { data, error } = await q;
  if (error) return toast('Could not load messages.');
  const rows = (data || []).slice().reverse();
  const old = box.querySelector('.older'); if (old) old.remove();
  const prevHeight = box.scrollHeight;
  if (older) rows.reverse().forEach(m => addMessage(m, 'start')); else rows.forEach(m => addMessage(m, 'end', true));
  if (data && data.length === 40) {
    const b = btn('Load older messages', 'btn older', () => loadMessages(true));
    box.prepend(b);
  }
  if (older) box.scrollTop = box.scrollHeight - prevHeight; else box.scrollTop = box.scrollHeight;
}

function fmtTime(s) {
  return new Date(s).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function addMessage(m, where, quiet) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  if (oldestId === null || m.id < oldestId) oldestId = m.id;
  if (m.sender_id !== me.id && blocked.has(m.sender_id)) return;
  const box = $('msgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  const mine = m.sender_id === me.id;
  const d = el('div', 'm' + (mine ? ' mine' : ''));
  d.dataset.id = m.id; d.dataset.sender = m.sender_id;
  if (!mine) {
    const w = el('div', 'who', m.sender_name);
    if (m.sender_role && m.sender_role !== 'student') w.append(' ', el('i', '', '· ' + (ROLE_LABEL[m.sender_role] || '')));
    d.append(w);
  }
  if (m.file_path) d.append(fileNode(m));
  if (m.body) d.append(el('div', 'txt', m.body));
  d.append(el('div', 'time', fmtTime(m.created_at)));
  d.onclick = e => { if (e.target.closest('.file,img')) return; openSheet(m); };
  if (where === 'start') box.prepend(d); else box.append(d);
  if (!quiet && where === 'end' && (mine || nearBottom)) box.scrollTop = box.scrollHeight;
}

function fileNode(m) {
  const isImg = (m.file_type || '').startsWith('image/');
  if (isImg) {
    const img = el('img', 'pic'); img.alt = m.file_name || 'Photo'; img.loading = 'lazy';
    sb.storage.from('chat-files').createSignedUrl(m.file_path, 3600).then(({ data }) => {
      if (data) { img.src = data.signedUrl; img.onclick = () => window.open(data.signedUrl, '_blank'); }
    });
    return img;
  }
  return btn('📄 ' + (m.file_name || 'File'), 'file', async () => {
    const { data, error } = await sb.storage.from('chat-files').createSignedUrl(m.file_path, 300, { download: m.file_name || true });
    if (error) return toast('Could not open that file.');
    location.href = data.signedUrl;
  });
}

/* ---- message actions ---- */
function openSheet(m) {
  const s = $('sheet'); s.replaceChildren();
  s.append(el('h3', '', m.sender_name));
  const close = () => $('sheet-bg').classList.add('hidden');
  if (m.sender_id !== me.id) {
    s.append(btn('Report this message', 'btn', () => reportForm(m)));
    s.append(btn('Block ' + m.sender_name, 'btn bad', async () => {
      const { error } = await sb.from('blocks').insert({ blocked_id: m.sender_id, blocked_name: m.sender_name });
      close();
      if (error) return toast('Could not block. Try again.');
      blocked.set(m.sender_id, m.sender_name);
      $('msgs').querySelectorAll('[data-sender="' + m.sender_id + '"]').forEach(n => n.remove());
      toast(m.sender_name + ' is blocked.');
    }));
  }
  if (m.sender_id === me.id || me.role === 'admin') {
    s.append(btn('Delete message', 'btn bad', async () => {
      const { error } = await sb.from('messages').delete().eq('id', m.id);
      close();
      if (error) return toast('Could not delete.');
      const n = $('msgs').querySelector('[data-id="' + m.id + '"]'); if (n) n.remove();
    }));
  }
  s.append(btn('Cancel', 'btn', close));
  $('sheet-bg').classList.remove('hidden');
}
$('sheet-bg').onclick = e => { if (e.target === $('sheet-bg')) $('sheet-bg').classList.add('hidden'); };

function reportForm(m) {
  const s = $('sheet'); s.replaceChildren();
  s.append(el('h3', '', 'Report ' + m.sender_name));
  const t = el('textarea'); t.rows = 3; t.maxLength = 500; t.placeholder = 'What is wrong with this message?';
  s.append(t);
  const row = el('div', 'actions');
  const send = btn('Send report', 'btn pri', async () => {
    send.disabled = true;
    const { error } = await sb.rpc('report_message', { mid: m.id, why: t.value.trim() });
    $('sheet-bg').classList.add('hidden');
    toast(error ? 'Could not send the report. Try again.' : 'Report sent to the admins.');
  });
  row.append(send, btn('Cancel', 'btn', () => $('sheet-bg').classList.add('hidden')));
  s.append(row); t.focus();
}

/* ---- sending ---- */
$('attach').onclick = () => $('file').click();
$('file').onchange = () => {
  const f = $('file').files[0]; $('file').value = '';
  if (!f) return;
  pendingFile = f; $('chip-name').textContent = '📎 ' + f.name; $('chip').classList.remove('hidden');
};
$('chip-x').onclick = () => { pendingFile = null; $('chip').classList.add('hidden'); };
$('text').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; });

// Shrink photos before upload so the free 1 GB of storage lasts
async function shrink(file) {
  if (!file.type.startsWith('image/')) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
    return blob ? new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch (_) { return file; }
}

$('composer').onsubmit = async e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!room || (!text && !pendingFile)) return;
  const send = $('send'); send.disabled = true;
  try {
    const row = { room_id: room.id, body: text || null };
    if (pendingFile) {
      const f = await shrink(pendingFile);
      if (!ALLOWED_TYPES.includes(f.type)) throw new Error('That file type is not allowed. Use a photo, PDF, Word, PowerPoint, Excel or text file.');
      if (f.size > MAX_FILE) throw new Error('That file is over 5 MB. Send a smaller one.');
      const safe = f.name.replace(/[^\w.\-]+/g, '_').slice(-80);
      const path = room.id + '/' + crypto.randomUUID() + '-' + safe;
      const { error: uErr } = await sb.storage.from('chat-files').upload(path, f, { contentType: f.type });
      if (uErr) throw uErr;
      Object.assign(row, { file_path: path, file_name: f.name, file_type: f.type });
    }
    const { data, error } = await sb.from('messages').insert(row).select().single();
    if (error) throw error;
    $('text').value = ''; $('text').style.height = 'auto';
    pendingFile = null; $('chip').classList.add('hidden');
    addMessage(data, 'end');
  } catch (err) {
    toast(String(err.message || err));
  }
  send.disabled = false;
};
$('text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(hover:hover)').matches) { e.preventDefault(); $('composer').requestSubmit(); }
});

/* ---------------- new private chat ---------------- */
let qTimer;
$('q').addEventListener('input', () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    const q = $('q').value.trim(), box = $('people-list');
    box.replaceChildren();
    if (q.length < 2) return;
    const { data, error } = await sb.rpc('search_people', { q });
    if (error) return box.append(el('p', 'empty', 'Search failed. Try again.'));
    if (!data.length) return box.append(el('p', 'empty', 'Nobody found with that name.'));
    data.forEach(p => {
      const b = btn('', 'row', async () => {
        const { data: rid, error: e2 } = await sb.rpc('start_dm', { other: p.id });
        if (e2) return toast(e2.message);
        openRoom({ id: rid, kind: 'dm', name: p.full_name, other_id: p.id });
      });
      b.append(el('b', '', p.full_name), el('span', '', p.department + ', ' + p.level + ' level' + (p.role !== 'student' ? ' · ' + ROLE_LABEL[p.role] : '')));
      box.append(b);
    });
  }, 300);
});

/* ---------------- approvals (admin, class reps, department helpers) ---------------- */
async function idPhotoUrl(uid) {
  const { data: files } = await sb.storage.from('id-cards').list(uid);
  if (!files || !files.length) return { url: null, names: [] };
  const { data } = await sb.storage.from('id-cards').createSignedUrl(uid + '/' + files[0].name, 600);
  return { url: data ? data.signedUrl : null, names: files.map(f => uid + '/' + f.name) };
}

async function loadReview() {
  const box = $('v-review'); box.replaceChildren(el('p', 'empty', 'Loading…'));
  const { data, error } = await sb.from('profiles').select('id,full_name,matric_no,department,level,created_at')
    .eq('status', 'pending').order('created_at').limit(50);
  box.replaceChildren();
  if (error) return box.append(el('p', 'empty', 'Could not load sign-ups.'));
  box.append(el('p', 'sub', 'Check the name and matric number against your class list and the ID photo. The photo is deleted once you decide.'));
  if (!data.length) box.append(el('p', 'empty', 'No one is waiting for approval.'));
  for (const p of data) {
    const c = el('div', 'card');
    c.append(el('b', '', p.full_name), el('p', '', p.matric_no), el('p', '', p.department + ', ' + p.level + ' level'));
    const holder = el('p', 'empty', 'Loading ID photo…'); c.append(holder);
    const decide = async status => {
      if (status === 'rejected' && !confirm('Reject ' + p.full_name + '?')) return;
      a.querySelectorAll('button').forEach(x => x.disabled = true);
      const { error: e1 } = await sb.rpc('review_signup', { target: p.id, new_status: status });
      if (e1) { a.querySelectorAll('button').forEach(x => x.disabled = false); return toast(e1.message); }
      const { names } = await idPhotoUrl(p.id);
      if (names.length) await sb.storage.from('id-cards').remove(names);
      c.remove(); refreshBadge();
      toast(status === 'approved' ? p.full_name + ' approved.' : p.full_name + ' rejected.');
    };
    const a = el('div', 'actions');
    a.append(btn('Approve', 'btn pri', () => decide('approved')), btn('Reject', 'btn bad', () => decide('rejected')));
    c.append(a); box.append(c);
    idPhotoUrl(p.id).then(({ url }) => {
      if (!url) { holder.textContent = 'No ID photo uploaded.'; return; }
      const img = el('img', 'idpic'); img.alt = 'Student ID card of ' + p.full_name; img.src = url;
      holder.replaceWith(img);
    });
  }
}

/* ---------------- reports (admin) ---------------- */
async function loadReports() {
  const box = $('v-reports'); box.replaceChildren(el('p', 'empty', 'Loading…'));
  const { data, error } = await sb.from('reports').select('*').eq('status', 'open').order('id', { ascending: false }).limit(50);
  box.replaceChildren();
  if (error) return box.append(el('p', 'empty', 'Could not load reports.'));
  if (!data.length) box.append(el('p', 'empty', 'No open reports.'));
  data.forEach(r => {
    const c = el('div', 'card');
    c.append(el('b', '', 'About ' + r.reported_name), el('p', '', 'Reported by ' + r.reporter_name + ' · ' + fmtTime(r.created_at)));
    if (r.reason) c.append(el('p', '', 'Reason: ' + r.reason));
    c.append(el('p', '', 'Message: ' + (r.message_text || '')));
    const a = el('div', 'actions');
    if (r.message_id) a.append(btn('Delete message', 'btn bad', async () => {
      const { error: e1 } = await sb.from('messages').delete().eq('id', r.message_id);
      toast(e1 ? 'Could not delete.' : 'Message deleted.');
    }));
    a.append(btn('Mark done', 'btn pri', async () => {
      const { error: e2 } = await sb.from('reports').update({ status: 'done' }).eq('id', r.id);
      if (e2) return toast('Could not update.');
      c.remove();
    }));
    c.append(a); box.append(c);
  });
}

/* ---------------- roles (admin) ---------------- */
let rTimer;
$('rq').addEventListener('input', () => {
  clearTimeout(rTimer);
  rTimer = setTimeout(async () => {
    const q = $('rq').value.trim().replace(/[,()%*_\\]/g, ''), box = $('roles-list');
    box.replaceChildren();
    if (q.length < 2) return;
    const { data, error } = await sb.from('profiles').select('id,full_name,matric_no,department,level,role')
      .eq('status', 'approved').or('full_name.ilike.%' + q + '%,matric_no.ilike.%' + q + '%').limit(20);
    if (error) return box.append(el('p', 'empty', 'Search failed.'));
    if (!data.length) return box.append(el('p', 'empty', 'Nobody found.'));
    data.forEach(p => {
      const c = el('div', 'card');
      c.append(el('b', '', p.full_name), el('p', '', p.matric_no + ' · ' + p.department + ', ' + p.level + ' level'));
      if (p.id === me.id) { c.append(el('p', 'empty', 'This is you. You cannot change your own role.')); box.append(c); return; }
      const sel = el('select');
      Object.keys(ROLE_LABEL).forEach(k => { const o = el('option', '', ROLE_LABEL[k]); o.value = k; if (k === p.role) o.selected = true; sel.append(o); });
      const a = el('div', 'actions');
      a.append(btn('Save role', 'btn pri', async () => {
        const { error: e1 } = await sb.rpc('set_role', { target: p.id, new_role: sel.value });
        toast(e1 ? e1.message : p.full_name + ' is now ' + ROLE_LABEL[sel.value] + '.');
      }));
      c.append(sel, a); box.append(c);
    });
  }, 300);
});

/* ---------------- start up ---------------- */
window.addEventListener('load', () => {
  if (window.supabase && ready()) sb.auth.getSession().then(({ data }) => { if (data.session) enter(data.session.user.id); });
});
</script>
